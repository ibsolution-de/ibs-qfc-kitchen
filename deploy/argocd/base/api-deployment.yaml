apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibs-qfc-kitchen-api
  labels:
    app.kubernetes.io/name: ibs-qfc-kitchen-api
    app.kubernetes.io/part-of: ibs-qfc-kitchen
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ibs-qfc-kitchen-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ibs-qfc-kitchen-api
        app.kubernetes.io/part-of: ibs-qfc-kitchen
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ibs-registry
      containers:
        - name: api
          image: ibs-qfc-kitchen-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: QFC_DB_PATH, value: /data/qfc.db }
            # Bootstrap admins: these accounts are created with the admin role
            # on startup, before they ever log in, and can then grant pm/bl to
            # everyone else. Every other new login defaults to employee only.
            - { name: QFC_ADMIN_EMAILS, value: nazar.kulyk@ibsolution.de }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: data
          persistentVolumeClaim:
            claimName: ibs-qfc-kitchen-api-data
