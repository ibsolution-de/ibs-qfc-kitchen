syntax = "proto3";

package qfc.portfolio.v1;

enum ProjectColor {
  PROJECT_COLOR_UNSPECIFIED = 0;
  PROJECT_COLOR_BLUE = 1;
  PROJECT_COLOR_GREEN = 2;
  PROJECT_COLOR_PURPLE = 3;
  PROJECT_COLOR_ORANGE = 4;
  PROJECT_COLOR_PINK = 5;
  PROJECT_COLOR_GRAY = 6;
}

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_ACTIVE = 1;
  PROJECT_STATUS_OPPORTUNITY = 2;
  PROJECT_STATUS_COMPLETED = 3;
  PROJECT_STATUS_ON_HOLD = 4;
}

// Sales pipeline stage.
enum PipelineStage {
  PIPELINE_STAGE_UNSPECIFIED = 0;
  PIPELINE_STAGE_LEAD = 1;
  PIPELINE_STAGE_QUALIFIED = 2;
  PIPELINE_STAGE_PROPOSAL = 3;
  PIPELINE_STAGE_NEGOTIATION = 4;
  PIPELINE_STAGE_CLOSED = 5;
}

// An account (Beauftragung) is a concrete engagement a project is broken
// into: normally with its own start/end dates and a concrete budget, and
// either already received (`CONFIRMED`) or still being requested (e.g.
// verbally agreed, `REQUESTED`). Resources are planned onto accounts to
// check whether the account budget can be drawn.
enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  // The engagement has been received.
  ACCOUNT_STATUS_CONFIRMED = 1;
  // Still in request (e.g. verbally agreed); budget not yet fixed.
  ACCOUNT_STATUS_REQUESTED = 2;
}

enum ProjectHealth {
  PROJECT_HEALTH_UNSPECIFIED = 0;
  PROJECT_HEALTH_GOOD = 1;
  PROJECT_HEALTH_WARNING = 2;
  PROJECT_HEALTH_CRITICAL = 3;
}

enum MilestonePhase {
  MILESTONE_PHASE_UNSPECIFIED = 0;
  MILESTONE_PHASE_PLANNING = 1;
  MILESTONE_PHASE_DEVELOPMENT = 2;
  MILESTONE_PHASE_TESTING = 3;
  MILESTONE_PHASE_DEPLOYMENT = 4;
}

message Milestone {
  string id = 1;
  string name = 2;
  // YYYY-MM-DD
  string date = 3;
  MilestonePhase phase = 4;
}

// A concrete engagement (Beauftragung) belonging to exactly one project.
// The server stores these in their own table and embeds them into
// `Project.accounts` on every read; clients manage them via
// `UpsertAccount`/`DeleteAccount`, never by sending them inside a
// `Project` upsert (the server strips them before persisting the blob).
message Account {
  string id = 1;
  string project_id = 2;
  // Free-form display label, e.g. "PO 2026-01" or "Rahmenvertrag".
  string name = 3;
  AccountStatus status = 4;
  // YYYY-MM-DD calendar dates (dates convention: plain string, no time of
  // day, no time zone), matching `Project.start_date`/`end_date`.
  optional string start_date = 5;
  optional string end_date = 6;
  // The concrete budget of this account, as a decimal string in the same
  // display convention as `Project.budget` (e.g. "80k" or "100000") —
  // machine-readable money is deliberately avoided here the same way it is
  // on the project; the client parses it via its `parseBudget` helper.
  optional string budget = 7;
}

message Project {
  string id = 1;
  string name = 2;
  string client = 3;
  ProjectColor color = 4;
  ProjectStatus status = 5;
  // Days
  optional int32 volume = 6;
  // YYYY-MM-DD calendar dates (dates convention: plain string, no time of
  // day, no time zone).
  optional string start_date = 7;
  optional string end_date = 8;
  // Free-form display label (e.g. "80k") — deliberately NOT parsed money;
  // hourly_rate below is the machine-readable money field of this message.
  optional string budget = 9;
  optional string topic = 10;
  optional string notes = 11;
  // Critical for conflict detection.
  optional bool is_critical = 12;
  // EUR per hour as a decimal string in major units (e.g. "120" or
  // "97.50"). A string, not a double: rates feed cost computations and
  // binary floats put rounding artifacts on the wire.
  optional string hourly_rate = 13;
  repeated Milestone milestones = 14;
  // 0-100%
  optional int32 probability = 15;
  optional PipelineStage stage = 16;
  optional ProjectHealth health = 17;
  optional string north_star_metric_id = 18;
  // The project's accounts (Beauftragungen). Server-enriched: filled in on
  // every read from the `account` table, stripped before the project blob
  // is persisted (see `Account`'s comment).
  repeated Account accounts = 19;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message UpsertProjectRequest {
  Project project = 1;
}

message UpsertProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string id = 1;
}

message DeleteProjectResponse {}

message UpsertAccountRequest {
  Account account = 1;
}

message UpsertAccountResponse {
  Account account = 1;
}

message DeleteAccountRequest {
  string id = 1;
}

message DeleteAccountResponse {}

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc UpsertProject(UpsertProjectRequest) returns (UpsertProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  // Create/update one account; deletion cascades to the assignments
  // planned against it.
  rpc UpsertAccount(UpsertAccountRequest) returns (UpsertAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}
