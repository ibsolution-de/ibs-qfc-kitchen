syntax = "proto3";

package qfc.portfolio.v1;

enum ProjectColor {
  PROJECT_COLOR_UNSPECIFIED = 0;
  PROJECT_COLOR_BLUE = 1;
  PROJECT_COLOR_GREEN = 2;
  PROJECT_COLOR_PURPLE = 3;
  PROJECT_COLOR_ORANGE = 4;
  PROJECT_COLOR_PINK = 5;
  PROJECT_COLOR_GRAY = 6;
}

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_ACTIVE = 1;
  PROJECT_STATUS_OPPORTUNITY = 2;
  PROJECT_STATUS_COMPLETED = 3;
  PROJECT_STATUS_ON_HOLD = 4;
}

// Sales pipeline stage.
enum PipelineStage {
  PIPELINE_STAGE_UNSPECIFIED = 0;
  PIPELINE_STAGE_LEAD = 1;
  PIPELINE_STAGE_QUALIFIED = 2;
  PIPELINE_STAGE_PROPOSAL = 3;
  PIPELINE_STAGE_NEGOTIATION = 4;
  PIPELINE_STAGE_CLOSED = 5;
}

enum ProjectHealth {
  PROJECT_HEALTH_UNSPECIFIED = 0;
  PROJECT_HEALTH_GOOD = 1;
  PROJECT_HEALTH_WARNING = 2;
  PROJECT_HEALTH_CRITICAL = 3;
}

enum MilestonePhase {
  MILESTONE_PHASE_UNSPECIFIED = 0;
  MILESTONE_PHASE_PLANNING = 1;
  MILESTONE_PHASE_DEVELOPMENT = 2;
  MILESTONE_PHASE_TESTING = 3;
  MILESTONE_PHASE_DEPLOYMENT = 4;
}

message Milestone {
  string id = 1;
  string name = 2;
  // YYYY-MM-DD
  string date = 3;
  MilestonePhase phase = 4;
}

message Project {
  string id = 1;
  string name = 2;
  string client = 3;
  ProjectColor color = 4;
  ProjectStatus status = 5;
  // Days
  optional int32 volume = 6;
  optional string start_date = 7;
  optional string end_date = 8;
  optional string budget = 9;
  optional string topic = 10;
  optional string notes = 11;
  // Critical for conflict detection.
  optional bool is_critical = 12;
  // EUR per hour (default ~100)
  optional double hourly_rate = 13;
  repeated Milestone milestones = 14;
  // 0-100%
  optional int32 probability = 15;
  optional PipelineStage stage = 16;
  optional ProjectHealth health = 17;
  optional string north_star_metric_id = 18;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message UpsertProjectRequest {
  Project project = 1;
}

message UpsertProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string id = 1;
}

message DeleteProjectResponse {}

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc UpsertProject(UpsertProjectRequest) returns (UpsertProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
}
