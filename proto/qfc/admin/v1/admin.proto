syntax = "proto3";

package qfc.admin.v1;

import "qfc/session/v1/session.proto";

message ListUsersRequest {}

message ListUsersResponse {
  repeated qfc.session.v1.User users = 1;
}

// Creates a user that has never logged in, or updates the roles and employee
// link of one that has.
//
// Only the admin-writable subset of a user is accepted: `name` and `avatar` are
// derived from the proxy headers at login time, so taking them here would let an
// admin set values the next login silently overwrites. A pre-created user gets
// `name = email` as a placeholder until their first login supplies the real one.
message UpsertUserRequest {
  string email = 1;
  // Must not be empty.
  repeated qfc.session.v1.UserRole roles = 2;
  // Links this login to an employee record, which is what binds a user to their
  // own overview.
  optional string employee_id = 3;
}

message UpsertUserResponse {
  qfc.session.v1.User user = 1;
}

message DeleteUserRequest {
  // Users are identified by email, deliberately unlike the id-based Delete*
  // RPCs of the other services: the email IS the user's auth identity
  // (derived from the proxy headers at login) and the primary key of the
  // users table — there is no surrogate id to delete by.
  string email = 1;
}

message DeleteUserResponse {}

// Runtime-editable application settings. Stored in the `meta` key/value
// table; values not yet overridden there fall back to the startup
// environment (QFC_DEFAULT_ROLE / QFC_ADMIN_EMAILS), which is what the
// `environment` field of GetAppSettingsResponse exposes for comparison.
message AppSettings {
  // Role assigned the first time a user is seen. Must not be
  // USER_ROLE_ADMIN (same rule as QFC_DEFAULT_ROLE).
  qfc.session.v1.UserRole default_role = 1;
  // Addresses seeded with USER_ROLE_ADMIN on first sighting.
  repeated string admin_emails = 2;
  // How many plan revisions (frozen planning snapshots) the system keeps.
  // Older revisions are pruned automatically once a new one is created.
  // Must be one of 2, 3, 5 or 10; when absent, the startup environment
  // (QFC_PLAN_REVISION_RETENTION) applies, then 5.
  optional int32 plan_revision_retention = 3;
}

message GetAppSettingsRequest {}

message GetAppSettingsResponse {
  // Effective values: DB override when present, startup environment
  // otherwise.
  AppSettings effective = 1;
  // Startup-environment values, so the UI can show what an override shadows.
  AppSettings environment = 2;
  bool default_role_overridden = 3;
  bool admin_emails_overridden = 4;
  bool plan_revision_retention_overridden = 5;
}

message UpdateAppSettingsRequest {
  AppSettings settings = 1;
}

message UpdateAppSettingsResponse {
  // Effective values after the update.
  AppSettings effective = 1;
}

message EntityCounts {
  int64 users = 1;
  int64 employees = 2;
  int64 customers = 3;
  int64 projects = 4;
  int64 plan_versions = 5;
  int64 assignments = 6;
  int64 absences = 7;
  int64 quarter_data = 8;
  int64 strategic_goals = 9;
  int64 north_star_metrics = 10;
  int64 one_on_one_sessions = 11;
  int64 public_holidays = 12;
}

message ChangeLogStats {
  int64 rows = 1;
  // 0 when the log is empty.
  int64 oldest_seq = 2;
  int64 newest_seq = 3;
  // Configured retention cap (server-side constant).
  int64 retention_rows = 4;
}

message SystemStatus {
  int64 server_started_at_millis = 1;
  int64 server_time_millis = 2;
  // CARGO_PKG_VERSION of the running binary.
  string version = 3;
  string db_path = 4;
  // page_count * page_size.
  int64 db_size_bytes = 5;
  // QFC_DEV_USER set — must never be true in production.
  bool dev_user_mode = 6;
  // Live Watch-stream subscriptions (connected clients).
  int64 active_watch_subscriptions = 7;
  EntityCounts entities = 8;
  ChangeLogStats change_log = 9;
}

message GetSystemStatusRequest {}

message GetSystemStatusResponse {
  SystemStatus status = 1;
}

// Account and role administration. Every RPC requires the caller to hold
// USER_ROLE_ADMIN; everyone else gets permission_denied. Roles are granted
// and revoked here and nowhere else — a user can never change their own
// role set (no self-service path exists), and the service refuses to
// remove the admin role from the last remaining admin (or from the caller's
// own account), so an admin lockout is impossible through the API.
// The other services enforce their own usecase-level role gates for
// mutating RPCs (see each service's proto/impl docs).
service AdminService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpsertUser(UpsertUserRequest) returns (UpsertUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // Application setup: runtime settings with startup-env fallback.
  rpc GetAppSettings(GetAppSettingsRequest) returns (GetAppSettingsResponse);
  rpc UpdateAppSettings(UpdateAppSettingsRequest) returns (UpdateAppSettingsResponse);
  // System monitoring: uptime, storage, entity counts, live watchers.
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse);
}
