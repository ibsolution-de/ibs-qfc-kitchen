# Weekly dependency updates. Docker entries also bump the pinned base-image
# digests in the Dockerfiles (tag@sha256:...) so the pins stay fresh.
version: 2
updates:
  - package-ecosystem: docker
    directory: /deploy/images/api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/images/web
    schedule:
      interval: weekly
    # Node 24 is Active LTS; 26 stays Current until Oct 2026. The docker
    # ecosystem has no LTS notion and would re-propose the major every week.
    # Digest and patch refreshes for 24-alpine still come through, as do
    # nginx-unprivileged bumps — the rule is scoped to node.
    ignore:
      - dependency-name: "node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /api
    schedule:
      interval: weekly
    # buffa is 0.x, so a minor bump there is a breaking change. connectrpc 0.8.1
    # and connectrpc-build 0.8.0 both require buffa ^0.8.1 — a solo bump to 0.9
    # puts two buffa crates in the graph and breaks the generated code
    # (write_to: BufMut vs. EncodeSink). Note 0.8.1 -> 0.9.1 classifies as
    # semver-MINOR (major stays 0); semver-major is listed only to cover a later
    # 1.0. buffa patch bumps still come through. Drop this rule once connectrpc
    # ships a release requiring buffa ^0.9, then bump both together.
    ignore:
      - dependency-name: "buffa"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # pnpm workspaces are covered by the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
